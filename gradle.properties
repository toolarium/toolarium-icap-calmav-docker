# base information
projectType              = container
projectRootPackageName   =
projectGroupId           = toolarium
projectComponentId       = toolarium
projectDescription       = Docker conatiner wih calmav as service.
projectUrl               =

# docker image and timezone
#dockerImage               = alpine:3.19
#dockerTimezone            = UTC

# docker repository (Docker Hub) - set your credentials here or in ~/.gradle/gradle.properties
#dockerRepositoryHost      = docker.io/<your-dockerhub-username>
#dockerRepositoryUser      = <your-dockerhub-username>
#dockerRepositoryPassword  = <your-dockerhub-password>

# docker UID/GID can be overwritten
# dockerUID                = 3000
# dockerGID                = 3000

# disable Maven Central publishing (not applicable for container projects)
commonGradleBuildReleasePublish = false

# tool information
# checkstyleToolVersion    = 8.42
# testDependencyVersion    = 5.6.2
# sourceCompatibility      = 11
# targetCompatibility      = 11

# jvm information
org.gradle.jvmargs       = -Xmx1g -XX:MaxHeapSize=1g -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.logging.level = quiet
org.gradle.console       = rich
org.gradle.warning.mode  = all
